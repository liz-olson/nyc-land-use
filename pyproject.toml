[project]
name = "nyc-land-use"
version = "0.1.0"
description = "Tracking NYC land use applications from filing through City Council review to construction."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "requests>=2.32",   # HTTP calls to NYC Open Data (Socrata) and other APIs
    "duckdb>=1.2",      # local analytical database; same engine MotherDuck runs
    "pyarrow>=18",      # reading and writing Parquet files
    "dbt-duckdb>=1.9",  # dbt (SQL transformations + tests + docs) with the DuckDB adapter
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pytest>=8",        # unit tests for ingestion code
    "ruff>=0.8",        # linter + formatter: catches bugs and keeps style consistent
]

[tool.pytest.ini_options]
testpaths = ["ingest/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]  # errors, pyflakes, import sorting, bugbear, pyupgrade

# Exploration notebooks are scratch work, so style rules are relaxed there.
# Rules that catch real bugs (undefined names, syntax errors, etc.) still apply.
[tool.ruff.lint.per-file-ignores]
"notebooks/**" = [
    "E501",  # line too long: long SQL strings and comments are fine
    "E402",  # imports not at top: cells often import as they go
    "F401",  # unused import: harmless while exploring
    "F841",  # variable assigned but never used: common in scratch cells
    "I001",  # import order
]
